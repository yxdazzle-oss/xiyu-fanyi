<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西语课堂 · 实时翻译</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --text:#1d1d1f; --muted:#7a7a80; --line:#e4e2dc;
    --accent:#c0392b; --accent-soft:#fbeae8; --ok:#2e7d4f; --zh-size:24px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141416; --panel:#1e1e21; --text:#ececef; --muted:#8d8d95; --line:#2e2e33; --accent:#ff6b5b; --accent-soft:#3a201d; --ok:#5cc28a; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  h1{font-size:17px;margin:0 8px 0 0;font-weight:650;white-space:nowrap}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 18px}
  button.primary.on{background:var(--panel);color:var(--accent)}
  button.small{font-size:12px;padding:3px 8px;border-radius:6px}
  label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  #status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  #status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  #status.live .dot{background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .spacer{flex:1}
  #settings{background:var(--panel);border-bottom:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
  #settings[hidden]{display:none}
  #settings .field{display:flex;flex-direction:column;gap:4px}
  #settings .field.wide{grid-column:1/-1}
  #settings span{font-size:12px;color:var(--muted)}
  input[type=text],input[type=password],select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
  textarea{min-height:56px;resize:vertical}
  #settings .actions{grid-column:1/-1;display:flex;gap:10px;align-items:center}
  #testResult{font-size:13px;color:var(--muted)}
  main{flex:1;overflow-y:auto;padding:16px 16px 8px}
  .wrap{max-width:980px;margin:0 auto}
  .empty{color:var(--muted);text-align:center;margin-top:12vh;line-height:1.9;font-size:15px}
  .seg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .seg .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
  .seg .meta .tools{margin-left:auto;display:flex;gap:6px;opacity:.55}
  .seg:hover .meta .tools{opacity:1}
  .seg .es{color:var(--muted);font-size:calc(var(--zh-size) * .62);line-height:1.45;margin-bottom:4px}
  body.hide-es .seg .es{display:none}
  .seg .zh{font-size:var(--zh-size);line-height:1.5;font-weight:500}
  .seg .zh.pending{color:var(--muted)}
  .seg .err{color:var(--accent);font-size:13px;margin-top:4px}
  .seg .explain{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:15px;line-height:1.7;white-space:pre-wrap}
  #live{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;min-height:48px}
  #live .wrap{display:flex;gap:10px;align-items:baseline}
  #live .label{font-size:12px;color:var(--muted);white-space:nowrap}
  #interim{font-size:17px;color:var(--text);opacity:.8;font-style:italic}
</style>
</head>
<body>
<header>
  <h1>西语课堂 · 实时翻译</h1>
  <button id="startBtn" class="primary">● 开始听</button>
  <span id="status"><span class="dot"></span><span id="statusText">未开始</span></span>
  <span class="spacer"></span>
  <label>字号 <input type="range" id="fontSize" min="16" max="44" value="24"></label>
  <label><input type="checkbox" id="showEs" checked> 显示西语原文</label>
  <button id="exportBtn">导出笔记</button>
  <button id="clearBtn">清空</button>
  <button id="settingsBtn">设置</button>
</header>

<section id="settings" hidden>
  <div class="field">
    <span>翻译用的 AI 服务</span>
    <select id="provider">
      <option value="deepseek">DeepSeek</option>
      <option value="openai">OpenAI</option>
      <option value="custom">其他（OpenAI 兼容接口）</option>
    </select>
  </div>
  <div class="field">
    <span>API 地址（Base URL）</span>
    <input type="text" id="base" placeholder="https://api.deepseek.com">
  </div>
  <div class="field">
    <span>模型</span>
    <input type="text" id="model" placeholder="deepseek-flash">
  </div>
  <div class="field">
    <span>API Key（只保存在这台电脑的浏览器里）</span>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>
  <div class="field">
    <span>语音识别引擎</span>
    <select id="engine">
      <option value="whisper">Whisper 转写（推荐：不漏句、更准，需要转写 Key）</option>
      <option value="browser">浏览器自带（免费，但容易漏掉后半句）</option>
    </select>
  </div>
  <div class="field stt">
    <span>转写服务</span>
    <select id="sttProvider">
      <option value="groq">Groq（whisper-large-v3-turbo，很便宜，有免费额度）</option>
      <option value="openai">OpenAI（gpt-4o-mini-transcribe）</option>
      <option value="custom">其他（OpenAI 兼容接口）</option>
    </select>
  </div>
  <div class="field stt">
    <span>转写 API 地址</span>
    <input type="text" id="sttBase" placeholder="https://api.groq.com/openai/v1">
  </div>
  <div class="field stt">
    <span>转写模型</span>
    <input type="text" id="sttModel" placeholder="whisper-large-v3-turbo">
  </div>
  <div class="field stt">
    <span>转写 API Key（Groq 的 Key 以 gsk_ 开头）</span>
    <input type="password" id="sttKey" placeholder="gsk_...">
  </div>
  <div class="field">
    <span>老师的口音 / 识别语言</span>
    <select id="lang">
      <option value="es-ES">西班牙（es-ES）</option>
      <option value="es-MX">墨西哥（es-MX）</option>
      <option value="es-AR">阿根廷（es-AR）</option>
      <option value="es-CO">哥伦比亚（es-CO）</option>
      <option value="es-US">美国西语（es-US）</option>
    </select>
  </div>
  <div class="field">
    <span>断句：老师停顿多久再翻译</span>
    <select id="pace">
      <option value="fast">快（短停顿就翻，最及时，可能断在半句）</option>
      <option value="normal">标准（推荐）</option>
      <option value="full">完整（等更长的停顿，最准但更慢）</option>
    </select>
  </div>
  <div class="field wide">
    <span>本节课主题 / 背景（可选，帮助 AI 翻得更准，比如：“A2 西语课，今天讲过去时 pretérito indefinido”或“INEF 运动训练学研讨课”）</span>
    <textarea id="topic"></textarea>
  </div>
  <div class="actions">
    <button id="saveBtn" class="primary">保存</button>
    <button id="testBtn">测试 API</button>
    <span id="testResult"></span>
  </div>
</section>

<main id="feedScroll"><div class="wrap" id="feed"></div></main>

<div id="live"><div class="wrap"><span class="label">正在听：</span><span id="interim"></span></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PRESETS = {
    deepseek: { base: 'https://api.deepseek.com', model: 'deepseek-flash' },
    openai:   { base: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
    custom:   { base: '', model: '' }
  };
  const CFG_KEY = 'es-zh-live.cfg', SEG_KEY = 'es-zh-live.segments', UI_KEY = 'es-zh-live.ui';
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  let cfg = Object.assign({ provider:'deepseek', base:PRESETS.deepseek.base, model:PRESETS.deepseek.model, key:'', lang:'es-ES', topic:'', pace:'normal', engine:'whisper', sttProvider:'groq', sttBase:'https://api.groq.com/openai/v1', sttModel:'whisper-large-v3-turbo', sttKey:'' }, store.get(CFG_KEY, {}));
  if (cfg.model === 'deepseek-chat') cfg.model = 'deepseek-flash';
  let ui = Object.assign({ fontSize:24, showEs:true }, store.get(UI_KEY, {}));
  let segments = store.get(SEG_KEY, []);
  let nextId = segments.reduce((m, s) => Math.max(m, s.id), 0) + 1;

  // ---------- UI basics ----------
  function applyUi(){
    document.documentElement.style.setProperty('--zh-size', ui.fontSize + 'px');
    $('fontSize').value = ui.fontSize;
    $('showEs').checked = ui.showEs;
    document.body.classList.toggle('hide-es', !ui.showEs);
  }
  $('fontSize').oninput = e => { ui.fontSize = +e.target.value; applyUi(); store.set(UI_KEY, ui); };
  $('showEs').onchange = e => { ui.showEs = e.target.checked; applyUi(); store.set(UI_KEY, ui); };

  function setStatus(text, live){ $('statusText').textContent = text; $('status').classList.toggle('live', !!live); }

  function fillSettings(){
    $('provider').value = cfg.provider; $('base').value = cfg.base; $('model').value = cfg.model;
    $('apiKey').value = cfg.key; $('lang').value = cfg.lang; $('topic').value = cfg.topic; $('pace').value = cfg.pace;
    $('engine').value = cfg.engine; $('sttProvider').value = cfg.sttProvider; $('sttBase').value = cfg.sttBase; $('sttModel').value = cfg.sttModel; $('sttKey').value = cfg.sttKey; toggleStt();
  }
  function readSettings(){
    cfg.provider = $('provider').value; cfg.base = $('base').value.trim(); cfg.model = $('model').value.trim();
    cfg.key = $('apiKey').value.trim(); cfg.lang = $('lang').value; cfg.topic = $('topic').value.trim(); cfg.pace = $('pace').value;
    cfg.engine = $('engine').value; cfg.sttProvider = $('sttProvider').value; cfg.sttBase = $('sttBase').value.trim(); cfg.sttModel = $('sttModel').value.trim(); cfg.sttKey = $('sttKey').value.trim();
    store.set(CFG_KEY, cfg);
  }
  $('provider').onchange = e => { const p = PRESETS[e.target.value]; if (p.base) { $('base').value = p.base; $('model').value = p.model; } };
  const STT_PRESETS = {
    groq:   { base: 'https://api.groq.com/openai/v1', model: 'whisper-large-v3-turbo' },
    openai: { base: 'https://api.openai.com/v1', model: 'gpt-4o-mini-transcribe' },
    custom: { base: '', model: '' }
  };
  function toggleStt(){ const on = $('engine').value === 'whisper'; document.querySelectorAll('#settings .stt').forEach(el => { el.style.display = on ? '' : 'none'; }); }
  $('engine').onchange = toggleStt;
  $('sttProvider').onchange = e => { const p = STT_PRESETS[e.target.value]; if (p.base) { $('sttBase').value = p.base; $('sttModel').value = p.model; } };
  $('settingsBtn').onclick = () => { const s = $('settings'); s.hidden = !s.hidden; if (!s.hidden) fillSettings(); };
  $('saveBtn').onclick = () => {
    readSettings(); $('settings').hidden = true;
    if (rec && running) { rec.lang = cfg.lang; }
    setStatus(running ? '正在听…' : '设置已保存', running);
  };
  $('testBtn').onclick = async () => {
    readSettings(); $('testResult').textContent = '测试中…';
    try {
      let out = '';
      await callLLM([{ role:'system', content:'把西班牙语翻译成简体中文，只输出译文。' }, { role:'user', content:'Hola a todos, hoy vamos a hablar del pretérito indefinido.' }], d => { out += d; $('testResult').textContent = '✓ ' + out; });
      if (!out) $('testResult').textContent = '接口通了，但没有返回内容，检查一下模型名';
      if (cfg.engine === 'whisper') {
        try { await callSTT(encodeWav([new Float32Array(16000)], 16000)); }
        catch (e) { throw new Error('翻译接口正常，但转写接口出错：' + e.message); }
        $('testResult').textContent += '　｜　转写接口 ✓';
      }
    } catch (e) { $('testResult').textContent = '✗ ' + e.message; }
  };

  // ---------- LLM call (OpenAI-compatible, streaming) ----------
  let noThinkingParam = false;
  async function callLLM(messages, onDelta){
    if (!cfg.key) throw new Error('还没有填写 API Key');
    const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
    const payload = { model: cfg.model, messages, stream: true, temperature: 0.3 };
    // 实时翻译要快：DeepSeek 新模型默认会先“思考”，这里关掉；接口不认这个参数就自动去掉重试
    if (/deepseek/i.test(cfg.base) && !noThinkingParam) payload.thinking = { type: 'disabled' };
    const send = () => fetch(url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify(payload)
    });
    let res = await send();
    if (res.status === 400 && payload.thinking) { noThinkingParam = true; delete payload.thinking; res = await send(); }
    if (!res.ok) {
      let t = ''; try { t = await res.text(); } catch(e){}
      throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 200));
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (c) onDelta(c);
        } catch(e){}
      }
    }
  }

  function systemPrompt(){
    return '你是西班牙语课堂的同声传译员，听众是一位正在学西语、还听不太懂的中国学生。\n' +
      '输入是浏览器语音识别出的老师讲话，可能缺标点、有同音词识别错误或半句话，请结合前文合理推断后翻译成自然、口语化的简体中文。\n' +
      '输入是老师一次停顿前说的一整段话，可能包含好几句；请按完整意思翻译，最后半句如果明显没说完，也照常翻出来，不要自己补编。\n' +
      '规则：只输出这一段的中文译文，不要解释、不要加引号、不要重复前文；老师在讲解的西语单词或语法术语，保留西语原词并在括号里给中文，如“pretérito indefinido（简单过去时）”；如果内容只是语气词或无法辨认，输出“（……）”。' +
      (cfg.topic ? '\n本节课背景：' + cfg.topic : '');
  }

  async function translate(seg){
    seg.zh = ''; seg.error = ''; seg.state = 'pending'; render(seg);
    const prev = segments.filter(s => s.id < seg.id && s.es).slice(-4)
      .map(s => '西：' + s.es + '\n中：' + (s.zh || '（翻译中）')).join('\n\n');
    const user = (prev ? '【前文，仅供理解上下文，不要翻译】\n' + prev + '\n\n' : '') + '【请翻译这一段】\n' + seg.es;
    try {
      await callLLM([{ role:'system', content:systemPrompt() }, { role:'user', content:user }], d => { seg.zh += d; render(seg); });
      seg.state = 'done';
    } catch (e) {
      seg.state = 'error'; seg.error = '翻译失败：' + e.message;
    }
    render(seg); persist();
  }

  async function explain(seg){
    seg.explain = '讲解中…'; render(seg);
    let out = '';
    try {
      await callLLM([
        { role:'system', content:'你是耐心的西班牙语老师，学生母语是中文、水平初级。用简体中文讲解，简洁实用，不用 markdown 标题。' },
        { role:'user', content:'老师上课说了这句（语音识别，可能有误）：\n' + seg.es + '\n\n请：1）给出更准确的原句（如识别有误）；2）逐个列出关键词/短语：西语 - 词性/原形 - 中文；3）如果有值得注意的语法点，用一两句话说明。' }
      ], d => { out += d; seg.explain = out; render(seg); });
    } catch (e) { seg.explain = '讲解失败：' + e.message; }
    render(seg); persist();
  }

  // ---------- rendering ----------
  const els = new Map();
  function fmtTime(ts){ const d = new Date(ts); return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
  function render(seg){
    let el = els.get(seg.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'seg';
      el.innerHTML = '<div class="meta"><span class="t"></span><span class="tools">' +
        '<button class="small b-exp">📖 讲解</button><button class="small b-re">重译</button><button class="small b-del">删除</button></span></div>' +
        '<div class="es"></div><div class="zh"></div><div class="err"></div><div class="explain"></div>';
      el.querySelector('.b-exp').onclick = () => explain(seg);
      el.querySelector('.b-re').onclick = () => translate(seg);
      el.querySelector('.b-del').onclick = () => { segments = segments.filter(s => s !== seg); el.remove(); els.delete(seg.id); persist(); showEmpty(); };
      els.set(seg.id, el); $('feed').appendChild(el); showEmpty();
    }
    el.querySelector('.t').textContent = fmtTime(seg.time);
    el.querySelector('.es').textContent = seg.es;
    const zh = el.querySelector('.zh');
    zh.textContent = seg.zh || (seg.state === 'pending' ? '翻译中…' : seg.state === 'stt' ? '识别中…' : '');
    zh.classList.toggle('pending', !seg.zh);
    el.querySelector('.err').textContent = seg.error || '';
    const ex = el.querySelector('.explain'); ex.textContent = seg.explain || ''; ex.style.display = seg.explain ? '' : 'none';
    autoScroll();
  }
  function showEmpty(){
    let e = $('emptyHint');
    if (segments.length === 0 && !e) {
      e = document.createElement('div'); e.id = 'emptyHint'; e.className = 'empty';
      e.innerHTML = '第一次用：点右上角 <b>设置</b> 填好 API Key → 点 <b>● 开始听</b> → 允许使用麦克风。<br>把电脑放在能听清老师的位置，翻译会一句一句出现在这里。<br>看不懂某句时，点那一句右上角的 <b>📖 讲解</b>。';
      $('feed').appendChild(e);
    } else if (segments.length && e) e.remove();
  }
  let stick = true;
  $('feedScroll').addEventListener('scroll', () => { const m = $('feedScroll'); stick = m.scrollHeight - m.scrollTop - m.clientHeight < 120; });
  function autoScroll(){ if (stick) { const m = $('feedScroll'); m.scrollTop = m.scrollHeight; } }

  let persistTimer = null;
  function persist(){ clearTimeout(persistTimer); persistTimer = setTimeout(() => store.set(SEG_KEY, segments.map(s => ({ id:s.id, time:s.time, es:s.es, zh:s.zh, explain:s.explain, state:(s.state === 'pending' || s.state === 'stt') ? 'error' : s.state }))), 400); }

  function addSegment(text){
    const seg = { id: nextId++, time: Date.now(), es: text, zh: '', state: 'pending' };
    segments.push(seg); render(seg); translate(seg); persist();
  }

  // ---------- 断句缓冲：等老师停顿后再整段翻译 ----------
  const PACE = { fast:{ pause:1000, words:25 }, normal:{ pause:2000, words:45 }, full:{ pause:3500, words:70 } };
  let buffer = [], flushTimer = null, bufStart = 0, interimText = '';
  function pace(){ return PACE[cfg.pace] || PACE.normal; }
  function pushChunk(t){
    if (!buffer.length) bufStart = Date.now();
    buffer.push(t); showLive(); scheduleFlush();
  }
  function scheduleFlush(){
    clearTimeout(flushTimer);
    if (!buffer.length) return;
    const words = buffer.join(' ').split(/\s+/).length;
    // 太长了就先翻，免得一直等
    if (words >= pace().words || Date.now() - bufStart > 30000) { flush(); return; }
    flushTimer = setTimeout(flush, pace().pause);
  }
  function flush(){
    clearTimeout(flushTimer);
    if (!buffer.length) return;
    const text = buffer.join(' ').replace(/\s+/g, ' ').trim();
    buffer = []; showLive();
    if (text) addSegment(text);
  }
  function showLive(){
    const b = buffer.join(' ');
    $('interim').textContent = (b ? b + ' ' : '') + interimText;
  }

  $('clearBtn').onclick = () => {
    if (!segments.length || !confirm('清空所有记录？（建议先导出笔记）')) return;
    segments = []; els.clear(); $('feed').innerHTML = ''; persist(); showEmpty();
  };
  $('exportBtn').onclick = () => {
    if (!segments.length) return;
    const d = new Date(segments[0].time);
    const title = '西语课堂笔记 ' + d.toLocaleDateString('zh-CN');
    let md = '# ' + title + '\n\n' + (cfg.topic ? '> ' + cfg.topic + '\n\n' : '');
    for (const s of segments) {
      md += '**' + fmtTime(s.time) + '**  \n' + s.es + '  \n' + (s.zh || '') + '\n';
      if (s.explain) md += '\n' + s.explain.split('\n').map(l => '> ' + l).join('\n') + '\n';
      md += '\n';
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type:'text/markdown;charset=utf-8' }));
    a.download = title.replace(/[\/:]/g, '-') + '.md'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, running = false, wakeLock = null, lastInterim = '', interimTimer = null;

  function makeRec(){
    rec = new SR();
    rec.lang = cfg.lang; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => setStatus('正在听…', true);
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { const t = r[0].transcript.trim(); if (t) pushChunk(t); }
        else interim += r[0].transcript;
      }
      lastInterim = interim.trim();
      interimText = interim; showLive();
      // 老师还在说：推迟断句
      if (buffer.length && interim) scheduleFlush();
      // 老师一口气讲很久不停顿时，识别器可能迟迟不给最终结果：12 秒没更新就强制断句
      clearTimeout(interimTimer);
      if (lastInterim) interimTimer = setTimeout(() => { if (running && lastInterim) { try { rec.stop(); } catch(e){} } }, 12000);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        running = false; updateBtn(); setStatus('麦克风权限被拒绝：请在地址栏左侧允许麦克风后重试');
      } else if (e.error === 'network') {
        setStatus('语音识别需要联网，正在重试…', true);
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        setStatus('识别出错（' + e.error + '），正在重试…', true);
      }
    };
    rec.onend = () => {
      // stop() 时尚未定稿的半句，作为一句收下
      if (lastInterim) { pushChunk(lastInterim); lastInterim = ''; }
      interimText = ''; showLive();
      clearTimeout(interimTimer);
      if (running) setTimeout(() => { if (!running) return; try { rec.start(); } catch(e) { makeRec(); try { rec.start(); } catch(_){} } }, 200);
      else { flush(); setStatus('已停止'); }
    };
  }

  // ---------- 引擎二：持续录音 + Whisper 转写（不漏句） ----------
  const W = { ctx:null, stream:null, node:null, src:null, chunks:[], preroll:[], speaking:false, speechMs:0, silenceMs:0, segMs:0, noise:0.004, level:0 };
  // pause：老师停顿多久算一句结束；minSeg：一段至少多长才切（太短的话 Whisper 容易听错）
  const WPACE = { fast:{ pause:600, minSeg:3000 }, normal:{ pause:900, minSeg:6000 }, full:{ pause:1400, minSeg:10000 } };
  const MAX_SEG_MS = 25000;
  let sttContext = '', activeEngine = null, liveTick = 0;

  async function startWhisper(){
    W.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:true, autoGainControl:true, channelCount:1 } });
    W.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (W.ctx.state === 'suspended') await W.ctx.resume();
    W.src = W.ctx.createMediaStreamSource(W.stream);
    W.node = W.ctx.createScriptProcessor(4096, 1, 1);
    W.src.connect(W.node); W.node.connect(W.ctx.destination);
    W.chunks = []; W.preroll = []; W.speaking = false; W.speechMs = 0; W.silenceMs = 0; W.segMs = 0;
    W.node.onaudioprocess = e => onAudio(e.inputBuffer.getChannelData(0));
    setStatus('正在听…', true); updateLive(true);
  }

  function onAudio(input){
    if (!W.ctx) return;
    const data = new Float32Array(input);
    const ms = data.length / W.ctx.sampleRate * 1000;
    let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);
    W.level = rms;
    // 自适应底噪：安静时快速下调，有声音时缓慢上调
    const voiced = rms > W.noise * 3 + 0.002;
    W.noise = rms < W.noise ? W.noise * 0.9 + rms * 0.1 : W.noise * (voiced ? 0.9995 : 0.99) + rms * (voiced ? 0.0005 : 0.01);
    if (!W.speaking) {
      W.preroll.push(data); if (W.preroll.length > 4) W.preroll.shift();
      if (voiced) { W.speaking = true; W.chunks = W.preroll.slice(); W.preroll = []; W.segMs = W.chunks.length * ms; W.speechMs = ms; W.silenceMs = 0; }
    } else {
      W.chunks.push(data); W.segMs += ms;
      if (voiced) { W.speechMs += ms; W.silenceMs = 0; } else W.silenceMs += ms;
      const p = WPACE[cfg.pace] || WPACE.normal;
      if ((W.silenceMs >= p.pause && W.segMs >= p.minSeg) || W.silenceMs >= 2500 || W.segMs >= MAX_SEG_MS) cutSegment();
    }
    updateLive();
  }

  function cutSegment(){
    if (!W.ctx) return;
    const chunks = W.chunks, speechMs = W.speechMs, rate = W.ctx.sampleRate;
    W.chunks = []; W.speaking = false; W.speechMs = 0; W.silenceMs = 0; W.segMs = 0;
    if (speechMs < 400) return;   // 只是噪音，丢掉
    transcribeSegment(encodeWav(chunks, rate));
  }

  function encodeWav(chunks, rate){
    let len = 0; for (const c of chunks) len += c.length;
    const all = new Float32Array(len); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
    const target = 16000, ratio = rate / target, outLen = Math.floor(len / ratio);
    const pcm = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const s0 = Math.floor(i * ratio), s1 = Math.max(s0 + 1, Math.min(len, Math.floor((i + 1) * ratio)));
      let s = 0; for (let j = s0; j < s1; j++) s += all[j] || 0;
      const x = Math.max(-1, Math.min(1, s / (s1 - s0)));
      pcm[i] = x < 0 ? x * 0x8000 : x * 0x7fff;
    }
    const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
    const w = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, target, true); dv.setUint32(28, target * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
    new Int16Array(buf, 44).set(pcm);
    return new Blob([buf], { type: 'audio/wav' });
  }

  async function callSTT(wav){
    if (!cfg.sttKey) throw new Error('还没有填写转写 API Key');
    const fd = new FormData();
    fd.append('file', wav, 'audio.wav');
    fd.append('model', cfg.sttModel);
    fd.append('language', (cfg.lang || 'es').slice(0, 2));
    fd.append('response_format', 'json');
    fd.append('temperature', '0');
    const prompt = sttContext.slice(-300).trim();   // 上文，帮 Whisper 接上话头
    if (prompt) fd.append('prompt', prompt);
    const res = await fetch(cfg.sttBase.replace(/\/+$/, '') + '/audio/transcriptions', { method:'POST', headers:{ 'Authorization':'Bearer ' + cfg.sttKey }, body: fd });
    if (!res.ok) { let t = ''; try { t = await res.text(); } catch(e){} throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 200)); }
    const j = await res.json();
    return (j.text || '').trim();
  }

  // Whisper 遇到噪音时偶尔会“脑补”出这些固定句子，过滤掉
  const HALLU = [/amara\.org/i, /subt[ií]tulo/i, /gracias por ver/i, /suscr[ií]be/i];
  function cleanTranscript(t){
    t = (t || '').trim();
    if (!t || !/[a-záéíóúñü]/i.test(t)) return '';
    if (t.length < 90 && HALLU.some(r => r.test(t))) return '';
    return t;
  }

  async function transcribeSegment(wav){
    const seg = { id: nextId++, time: Date.now(), es: '', zh: '', state: 'stt' };
    segments.push(seg); render(seg);
    try {
      const text = cleanTranscript(await callSTT(wav));
      if (!text) { segments = segments.filter(s => s !== seg); const el = els.get(seg.id); if (el) el.remove(); els.delete(seg.id); showEmpty(); return; }
      seg.es = text;
      sttContext = (sttContext + ' ' + text).slice(-600);
      translate(seg);
    } catch (e) {
      seg.state = 'error'; seg.error = '语音转写失败：' + e.message; render(seg);
    }
    persist();
  }

  function updateLive(force){
    const now = Date.now(); if (!force && now - liveTick < 150) return; liveTick = now;
    if (!W.ctx) return;
    const bars = Math.max(1, Math.min(12, Math.round(W.level / (W.noise * 3 + 0.002) * 3)));
    $('interim').textContent = W.speaking
      ? '🎙 录音中 ' + '▮'.repeat(bars) + '　本段 ' + Math.round(W.segMs / 1000) + ' 秒（老师一停顿就送去识别）'
      : '🎙 等老师说话…';
  }

  function stopWhisper(){
    try { if (W.speaking) cutSegment(); } catch(e) {}
    try { if (W.node) { W.node.onaudioprocess = null; W.node.disconnect(); } if (W.src) W.src.disconnect(); } catch(e) {}
    try { if (W.stream) W.stream.getTracks().forEach(t => t.stop()); } catch(e) {}
    try { if (W.ctx) W.ctx.close(); } catch(e) {}
    W.ctx = W.stream = W.node = W.src = null; W.speaking = false;
    $('interim').textContent = '';
  }

  function openSettingsWith(msg){ $('settings').hidden = false; fillSettings(); setStatus(msg); }

  async function start(){
    if (!cfg.key) { openSettingsWith('请先填写翻译用的 API Key 并保存'); return; }
    if (cfg.engine === 'whisper') {
      if (!cfg.sttKey) { openSettingsWith('请先填写转写 API Key（或把识别引擎换成“浏览器自带”）'); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('这个浏览器不能录音，请用 Chrome 或 Safari。'); return; }
      running = true; activeEngine = 'whisper'; updateBtn();
      try { await startWhisper(); }
      catch (e) { running = false; activeEngine = null; updateBtn(); stopWhisper(); setStatus('无法使用麦克风：' + e.message); return; }
    } else {
      if (!SR) { alert('这个浏览器不支持语音识别，请用 Chrome、Edge 或 Safari 打开。'); return; }
      running = true; activeEngine = 'browser'; updateBtn(); makeRec();
      try { rec.start(); } catch(e) {}
    }
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  function stop(){
    running = false; updateBtn();
    if (activeEngine === 'whisper') { stopWhisper(); setStatus('已停止'); }
    else { try { rec && rec.stop(); } catch(e) {} }
    activeEngine = null;
    try { wakeLock && wakeLock.release(); } catch(e) {} wakeLock = null;
  }
  function updateBtn(){ const b = $('startBtn'); b.textContent = running ? '■ 停止' : '● 开始听'; b.classList.toggle('on', running); }
  $('startBtn').onclick = () => running ? stop() : start();
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible' && 'wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }
  });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); running ? stop() : start(); } });

  // ---------- init ----------
  applyUi();
  segments.forEach(render);
  showEmpty();
  if (!cfg.key) setStatus('先点“设置”填写 API Key');
  else if (cfg.engine === 'whisper' && !cfg.sttKey) setStatus('已升级：请在“设置”里填转写 API Key，识别会更完整');
})();
</script>
</body>
</html>
